<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBooking - Ticket Management System</title>
    <link href="css/tailwind.generated.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-functions-compat.js"></script>
    <script src="js/firebase.js"></script>
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">

    <button id="theme-toggle" type="button" onclick="UI.toggleDarkMode()" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Navigation -->
    <nav id="navbar" class="hidden bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center gap-2">
                        <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-ticket-alt text-white text-sm"></i>
                        </div>
                        <span class="font-bold text-xl text-gray-900">EventBooking</span>
                    </div>
                    <div class="hidden md:ml-10 md:flex md:space-x-8" id="nav-links">
                        <!-- Dynamic nav links -->
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="user-info" class="flex items-center gap-3">
                        <!-- Dynamic user info -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <!-- Main Content Container -->
    <main id="app" class="min-h-screen">
        <!-- Dynamic content -->
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/components.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script src="js/init.js"></script>
    <!-- Application logic is split into ordered files above. -->
</body>
</html>
